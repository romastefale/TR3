<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=1080, initial-scale=1" />
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700;800;900&display=swap');

    :root {
      --bg: {{ bg }};
      --surface: {{ surface }};
      --surface-soft: {{ surface_soft }};
      --text: {{ text }};
      --muted: {{ muted }};
      --blue: {{ blue }};
      --green: {{ green }};
      --purple: {{ purple }};
      --line: {{ line }};
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 1080px;
      height: 1350px;
      overflow: hidden;
      font-family: Inter, "SF Pro Display", "Segoe UI", Arial, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 8% 6%,  color-mix(in srgb, var(--blue) 30%, transparent), transparent 36%),
        radial-gradient(circle at 92% 14%, color-mix(in srgb, var(--purple) 32%, transparent), transparent 40%),
        radial-gradient(circle at 50% 104%, color-mix(in srgb, var(--green) 22%, transparent), transparent 44%),
        var(--bg);
    }

    .card {
      width: 1080px;
      height: 1350px;
      padding: 56px 64px 60px;
      display: flex;
      flex-direction: column;
    }

    /* HEADER ----------------------------------------------------------------- */
    .header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      margin-bottom: 18px;
    }
    .brand {
      font-family: Inter;
      font-size: {{ font_brand }}px;
      font-weight: 800;
      letter-spacing: -.02em;
      color: var(--blue);
    }
    .brand .glyph { color: var(--green); margin-right: 10px; }

    .period {
      margin-bottom: 30px;
    }
    .period .label {
      display: block;
      font-family: Inter;
      font-size: {{ font_period_label }}px;
      font-weight: 700;
      letter-spacing: .22em;
      text-transform: uppercase;
      color: var(--purple);
      margin-bottom: 6px;
    }
    .period .value {
      font-family: 'Bebas Neue', Inter, sans-serif;
      font-size: {{ period_font_size }}px;
      line-height: .92;
      letter-spacing: .005em;
      color: var(--text);
      text-transform: uppercase;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 952px;
    }

    /* HERO ------------------------------------------------------------------- */
    .hero {
      display: flex;
      align-items: center;
      gap: 32px;
      padding: 26px;
      margin-bottom: 36px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 26px;
    }
    .hero-cover {
      width: 184px;
      height: 184px;
      flex-shrink: 0;
      object-fit: cover;
      border-radius: 18px;
      background: var(--surface-soft);
      box-shadow: 0 18px 44px rgba(0,0,0,.45);
    }
    .hero-info { min-width: 0; flex: 1; }
    .hero-label {
      font-size: {{ font_hero_label }}px;
      font-weight: 700;
      color: var(--muted);
      letter-spacing: .14em;
      text-transform: uppercase;
      margin-bottom: 10px;
    }
    .hero-track {
      font-size: {{ font_hero_track }}px;
      font-weight: 800;
      line-height: 1.04;
      letter-spacing: -.025em;
      color: var(--text);
      overflow: hidden;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
    }
    .hero-artist {
      margin-top: 8px;
      font-size: {{ font_hero_artist }}px;
      font-weight: 500;
      font-style: italic;
      color: var(--green);
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }
    .hero-plays {
      margin-top: 6px;
      font-family: 'Bebas Neue', Inter;
      font-size: {{ font_hero_plays_value }}px;
      letter-spacing: .04em;
      color: var(--blue);
    }
    .hero-plays .unit {
      font-size: {{ font_hero_plays_unit }}px;
      margin-left: 6px;
      color: var(--muted);
    }

    /* COLUMNS ---------------------------------------------------------------- */
    .columns {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 56px;
      flex: 1;
    }
    .col-title {
      font-size: {{ font_col_title }}px;
      font-weight: 800;
      color: var(--muted);
      letter-spacing: .16em;
      text-transform: uppercase;
      margin-bottom: 20px;
    }
    .col-title .accent { color: var(--green); margin-right: 8px; }

    .list {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .row {
      display: grid;
      grid-template-columns: 56px minmax(0, 1fr) auto;
      column-gap: 14px;
      align-items: baseline;
    }
    .rank {
      font-family: 'Bebas Neue', Inter;
      font-size: {{ font_list_rank }}px;
      color: var(--purple);
      font-variant-numeric: tabular-nums;
      line-height: 1;
    }
    .name {
      min-width: 0;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
      font-size: {{ font_list_item_name }}px;
      font-weight: 700;
      letter-spacing: -.025em;
      color: var(--text);
      line-height: 1.06;
    }
    .name .sub {
      display: block;
      margin-top: 4px;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
      font-size: {{ font_list_item_sub }}px;
      font-weight: 500;
      font-style: italic;
      letter-spacing: -.01em;
      color: var(--muted);
    }
    .count {
      font-family: 'Bebas Neue', Inter;
      font-size: {{ font_list_item_count }}px;
      letter-spacing: .02em;
      color: var(--green);
      font-variant-numeric: tabular-nums;
      line-height: 1;
    }

    /* FOOTER ----------------------------------------------------------------- */
    .footer {
      margin-top: 30px;
      padding-top: 26px;
      border-top: 1px solid var(--line);
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
    }
    .footer .total {
      font-family: 'Bebas Neue', Inter;
      font-size: {{ font_footer_total }}px;
      line-height: .82;
      color: var(--green);
      font-variant-numeric: tabular-nums;
      letter-spacing: .01em;
    }
    .footer .total-meta {
      text-align: right;
      padding-bottom: 6px;
    }
    .footer .total-meta .word {
      font-family: 'Bebas Neue', Inter;
      font-size: {{ font_footer_unit }}px;
      line-height: .9;
      letter-spacing: .04em;
      color: var(--text);
    }
    .footer .total-meta .hint {
      display: block;
      margin-top: 4px;
      font-family: Inter;
      font-size: {{ font_footer_hint }}px;
      font-weight: 600;
      letter-spacing: .18em;
      text-transform: uppercase;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <main class="card">
    <header class="header">
      <div class="brand"><span class="glyph">♫</span>{{ bot_name }}</div>
    </header>

    <div class="period">
      <span class="label">{{ period_label }}</span>
      <span class="value">{{ period_value }}</span>
    </div>

    <section class="hero">
      <img class="hero-cover" src="{{ hero_image }}" alt="" />
      <div class="hero-info">
        <div class="hero-label">Mais ouvida no período</div>
        <div class="hero-track">{{ hero_track }}</div>
        <div class="hero-artist">{{ hero_artist }}</div>
        <div class="hero-plays">{{ hero_plays }}<span class="unit">plays</span></div>
      </div>
    </section>

    <section class="columns">
      <div>
        <h2 class="col-title"><span class="accent">✦</span>Top artistas</h2>
        <div class="list">
          {{ artist_rows }}
        </div>
      </div>
      <div>
        <h2 class="col-title"><span class="accent">♫</span>Top músicas</h2>
        <div class="list">
          {{ track_rows }}
        </div>
      </div>
    </section>

    <footer class="footer">
      <div class="total">{{ minutes }}</div>
      <div class="total-meta">
        <div class="word">minutos</div>
        <span class="hint">no período</span>
      </div>
    </footer>
  </main>
</body>
</html>
