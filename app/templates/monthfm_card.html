<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=1080, initial-scale=1" />
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700;800;900&display=swap');

    :root {
      --bg: {{ bg }};
      --surface: {{ surface }};
      --surface-soft: {{ surface_soft }};
      --text: {{ text }};
      --muted: {{ muted }};
      --blue: {{ blue }};
      --green: {{ green }};
      --purple: {{ purple }};
      --line: {{ line }};
      --accent: {{ accent }};
      --accent-glow-top: {{ accent_glow_top }};
      --accent-glow-mid: {{ accent_glow_mid }};
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 1080px;
      height: {{ card_height }}px;
      overflow: hidden;
      font-family: Inter, "SF Pro Display", "Segoe UI", Arial, sans-serif;
      color: var(--text);
      background:
        radial-gradient(ellipse 1100px 720px at 50% -4%, var(--accent-glow-top), transparent 70%),
        radial-gradient(circle at 88% 18%, var(--accent-glow-mid), transparent 50%),
        radial-gradient(circle at 50% 108%, color-mix(in srgb, var(--purple) 18%, transparent), transparent 50%),
        var(--bg);
      font-feature-settings: "lnum" 1, "tnum" 1;
    }

    .card {
      width: 1080px;
      height: {{ card_height }}px;
      padding: 64px 72px 88px;
      display: flex;
      flex-direction: column;
    }

    /* HEADER ----------------------------------------------------------------- */
    .header {
      display: flex;
      align-items: baseline;
      justify-content: flex-end;
      margin-bottom: 22px;
    }
    .brand {
      font-family: Inter;
      font-size: {{ font_brand }}px;
      font-weight: 800;
      letter-spacing: -.02em;
      color: var(--blue);
    }
    .brand .glyph { color: var(--accent); margin-right: 12px; }

    .period {
      margin-bottom: 60px;
    }
    .period .label {
      display: block;
      font-family: Inter;
      font-size: {{ font_period_label }}px;
      font-weight: 700;
      letter-spacing: .22em;
      text-transform: uppercase;
      color: var(--purple);
      margin-bottom: 10px;
    }
    .period .value {
      font-family: 'Bebas Neue', Inter, sans-serif;
      font-size: {{ period_font_size }}px;
      line-height: .92;
      letter-spacing: .005em;
      color: var(--text);
      text-transform: uppercase;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 936px;
    }

    /* HERO — capa cobre o card, overlay escuro + blur ------------------------ */
    .hero {
      position: relative;
      height: 600px;
      border-radius: 32px;
      overflow: hidden;
      margin-bottom: 56px;
      background-color: var(--surface);
      box-shadow: 0 28px 72px rgba(0,0,0,.45);
    }
    .hero-bg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      filter: blur(2px) saturate(115%);
      transform: scale(1.06);
    }
    .hero-overlay {
      position: absolute;
      inset: 0;
      background:
        linear-gradient(180deg, rgba(11,10,26,.45) 0%, rgba(11,10,26,.78) 60%, rgba(11,10,26,.92) 100%),
        linear-gradient(135deg, rgba(0,0,0,.35) 0%, rgba(0,0,0,0) 55%);
    }
    .hero-content {
      position: relative;
      z-index: 1;
      height: 100%;
      padding: 40px 48px;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
    }
    .hero-label {
      font-size: {{ font_hero_label }}px;
      font-weight: 700;
      color: var(--accent);
      letter-spacing: .12em;
      text-transform: uppercase;
      margin-bottom: 14px;
      white-space: nowrap;
      text-shadow: 0 2px 12px rgba(0,0,0,.55);
    }
    .hero-track {
      font-size: {{ hero_track_font_size }}px;
      font-weight: 900;
      line-height: 1.06;
      letter-spacing: -.025em;
      color: #FFFFFF;
      text-transform: uppercase;
      overflow: hidden;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      text-shadow: 0 4px 22px rgba(0,0,0,.6);
    }
    .hero-artist {
      margin-top: 10px;
      font-size: {{ font_hero_artist }}px;
      font-weight: 500;
      font-style: italic;
      color: rgba(255,255,255,.82);
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
      text-shadow: 0 2px 14px rgba(0,0,0,.55);
    }
    .hero-plays {
      margin-top: 18px;
      font-family: Inter;
      font-weight: 900;
      font-size: {{ font_hero_plays_value }}px;
      letter-spacing: -.01em;
      color: var(--accent);
      font-variant-numeric: lining-nums tabular-nums;
      line-height: 1;
      text-shadow: 0 4px 18px rgba(0,0,0,.55);
    }
    .hero-plays .unit {
      font-family: Inter;
      font-weight: 700;
      font-size: {{ font_hero_plays_unit }}px;
      margin-left: 14px;
      color: rgba(255,255,255,.78);
      letter-spacing: .14em;
      text-transform: uppercase;
    }

    /* COLUMNS ---------------------------------------------------------------- */
    .columns {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 64px;
      flex: 1;
    }
    /* Cada coluna estica verticalmente para o tamanho do grid item,
       permitindo que .list distribua o espaço entre as linhas. */
    .columns > div {
      display: flex;
      flex-direction: column;
    }
    .col-title {
      font-size: {{ font_col_title }}px;
      font-weight: 800;
      color: var(--muted);
      letter-spacing: .12em;
      text-transform: uppercase;
      margin-bottom: 28px;
      white-space: nowrap;
    }
    .col-title .accent-icon { color: var(--accent); margin-right: 14px; }

    .list {
      display: flex;
      flex-direction: column;
      flex: 1;
      justify-content: space-between;
      gap: 28px;
    }
    .row {
      display: grid;
      grid-template-columns: 56px minmax(0, 1fr) 110px;
      column-gap: 14px;
      align-items: baseline;
    }
    .rank {
      font-family: Inter;
      font-weight: 900;
      font-size: 56px;
      color: var(--purple);
      font-variant-numeric: lining-nums tabular-nums;
      line-height: 1;
      letter-spacing: -.02em;
    }
    .name {
      min-width: 0;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
      font-size: 32px;
      font-weight: 700;
      letter-spacing: -.015em;
      color: var(--text);
      line-height: 1.2;
    }
    .count {
      font-family: Inter;
      font-weight: 900;
      font-size: {{ font_list_item_count }}px;
      letter-spacing: -.01em;
      color: var(--accent);
      font-variant-numeric: lining-nums tabular-nums;
      line-height: 1;
      text-align: right;
    }

    /* FOOTER ----------------------------------------------------------------- */
    .footer {
      margin-top: 44px;
      padding-top: 32px;
      border-top: 1px solid var(--line);
      display: flex;
      align-items: baseline;
      gap: 18px;
    }
    .footer .total {
      font-family: Inter;
      font-weight: 900;
      font-size: {{ font_footer_total }}px;
      line-height: .82;
      color: var(--accent);
      font-variant-numeric: lining-nums tabular-nums;
      letter-spacing: -.03em;
    }
    .footer .word {
      font-family: Inter;
      font-weight: 800;
      font-size: {{ font_footer_unit }}px;
      line-height: 1;
      letter-spacing: .04em;
      color: var(--accent);
      text-transform: uppercase;
      white-space: nowrap;
    }
  </style>
</head>
<body>
  <main class="card">
    <header class="header">
      <div class="brand"><span class="glyph">♫</span>{{ bot_name }}</div>
    </header>

    <div class="period">
      <span class="label">{{ period_label }}</span>
      <span class="value">{{ period_value }}</span>
    </div>

    <section class="hero">
      <img class="hero-bg" src="{{ hero_image }}" alt="" />
      <div class="hero-overlay"></div>
      <div class="hero-content">
        <div class="hero-label">Mais ouvida</div>
        <div class="hero-track">{{ hero_track }}</div>
        <div class="hero-plays">{{ hero_plays }}<span class="unit">plays</span></div>
      </div>
    </section>

    <section class="columns">
      <div>
        <h2 class="col-title"><span class="accent-icon">✦</span>Artistas</h2>
        <div class="list">
          {{ artist_rows }}
        </div>
      </div>
      <div>
        <h2 class="col-title"><span class="accent-icon">♫</span>Músicas</h2>
        <div class="list">
          {{ track_rows }}
        </div>
      </div>
    </section>

    <footer class="footer">
      <div class="total">{{ minutes }}</div>
      <div class="word">minutos</div>
    </footer>
  </main>
</body>
</html>
