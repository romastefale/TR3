<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: {{CARD_WIDTH}}px;
    height: {{CARD_HEIGHT}}px;
    overflow: hidden;
    background: #0a0a0d;
    color: #f4f4f6;
    font-family: 'Inter', 'Helvetica Neue', Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .card {
    position: relative;
    width: {{CARD_WIDTH}}px;
    height: {{CARD_HEIGHT}}px;
    padding: 72px 80px 88px;
    background:
      radial-gradient(120% 80% at 0% 0%, {{ACCENT_SOFT}} 0%, transparent 55%),
      radial-gradient(120% 80% at 100% 100%, rgba(20, 20, 28, .9) 0%, #0a0a0d 70%),
      #0a0a0d;
  }
  .header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 56px;
  }
  .eyebrow {
    font-size: 42px;
    font-weight: 700;
    letter-spacing: 6px;
    text-transform: uppercase;
    color: {{ACCENT}};
  }
  .brand {
    font-size: 36px;
    font-weight: 700;
    letter-spacing: 2px;
    color: #f4f4f6;
    opacity: .85;
  }
  .hero {
    display: flex;
    gap: 56px;
    align-items: flex-end;
    margin-bottom: 64px;
  }
  .cover {
    width: 520px;
    height: 520px;
    border-radius: 24px;
    background: #1a1a22 center/cover no-repeat;
    box-shadow:
      0 28px 56px rgba(0, 0, 0, .55),
      0 0 0 1px rgba(255, 255, 255, .04) inset;
    flex: 0 0 520px;
  }
  .hero-meta {
    padding-bottom: 16px;
    min-width: 0;
    flex: 1;
  }
  .hero-label {
    font-size: 34px;
    font-weight: 600;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: rgba(244, 244, 246, .55);
    margin-bottom: 18px;
  }
  .playlist-name {
    font-size: 76px;
    font-weight: 800;
    line-height: 1.02;
    letter-spacing: -1.5px;
    color: #f4f4f6;
    overflow: hidden;
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
  }
  .owner {
    margin-top: 22px;
    font-size: 32px;
    font-weight: 500;
    color: rgba(244, 244, 246, .65);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .list {
    display: flex;
    flex-direction: column;
    gap: 18px;
  }
  .row {
    display: flex;
    align-items: center;
    gap: 28px;
    padding: 4px 0;
  }
  .rank {
    flex: 0 0 76px;
    font-size: 54px;
    font-weight: 800;
    letter-spacing: -0.5px;
    color: {{ACCENT}};
    text-align: right;
    font-variant-numeric: tabular-nums;
  }
  .info {
    flex: 1;
    min-width: 0;
  }
  .title {
    font-size: 40px;
    font-weight: 700;
    color: #f4f4f6;
    line-height: 1.15;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .artist {
    margin-top: 6px;
    font-size: 30px;
    font-weight: 500;
    color: rgba(244, 244, 246, .58);
    line-height: 1.15;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="header">
      <div class="eyebrow">TOP 10 DA PLAYLIST</div>
      <div class="brand">♫ tigraoRADIO</div>
    </div>

    <div class="hero">
      <div class="cover" style="background-image: url('{{HERO_COVER}}');"></div>
      <div class="hero-meta">
        <div class="hero-label">PLAYLIST</div>
        <div class="playlist-name">{{PLAYLIST_NAME}}</div>
        {{OWNER_BLOCK}}
      </div>
    </div>

    <div class="list">
      {{ROWS}}
    </div>
  </div>
</body>
</html>
